services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cosy-pocket-builder
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      # Application
      - NODE_ENV=production
      - PORT=8080
      - HOST=0.0.0.0
      
      # Self-Repair Loop
      - SELF_REPAIR_ENABLED=true
      - MAX_REPAIR_RETRIES=2
      - VALIDATION_TIMEOUT_MS=5000
      - VALIDATION_STRATEGY=auto
      - BROWSER_POOL_SIZE=2
      - VALIDATION_MAX_HTML_SIZE=500000
      
      # AI Provider (required)
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      
      # Optional: Redis for rate limiting
      - REDIS_URL=redis://redis:6379
    volumes:
      # Persistent data
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/validationHealth"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: cosy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - app-network

  caddy:
    image: caddy:2-alpine
    container_name: cosy-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - EMAIL=${EMAIL:-admin@localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - app-network

volumes:
  redis-data:
  caddy-data:
  caddy-config:

networks:
  app-network:
    driver: bridge
